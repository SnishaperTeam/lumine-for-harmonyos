name: HarmonyOS Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonyos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up HarmonyOS command-line tools
        uses: ErBWs/setup-ohos@v2

      - name: Strip local signing configs
        shell: bash
        run: |
          python3 - <<'EOF'
          import re
          p = 'build-profile.json5'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'"signingConfigs"\s*:\s*\[.*?\],\s*\n', '', s, flags=re.S)
          s = re.sub(r'"signingConfig"\s*:\s*"default",\s*\n', '', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('signing configs stripped')
          EOF

      - name: Build HAP (debug)
        shell: bash
        env:
          DEVECO_SDK_HOME: ${{ env.HOS_SDK_HOME }}
        run: |
          hvigorw --mode module -p product=default -p buildMode=debug assembleHap --no-daemon

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumine-harmonyos-debug-${{ github.sha }}
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: error
          retention-days: 14
