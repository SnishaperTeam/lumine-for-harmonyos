name: HarmonyOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional tag name to publish, for example v1.0.0
        required: false
        type: string
      release_name:
        description: Optional GitHub release title
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: harmonyos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      HAP_GLOB: entry/build/default/outputs/default/*.hap
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up HarmonyOS command-line tools
        uses: ErBWs/setup-ohos@v2

      - name: Build HAP (release)
        shell: bash
        env:
          DEVECO_SDK_HOME: ${{ env.HOS_SDK_HOME }}
        run: |
          hvigorw --mode module -p product=default -p buildMode=release assembleHap --no-daemon

      - name: Compute artifact metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG_NAME}"
          fi

          if [[ -n "$tag" ]]; then
            should_release=true
          else
            tag="${GITHUB_SHA::7}"
            should_release=false
          fi

          release_name="${INPUT_RELEASE_NAME}"
          if [[ -z "$release_name" && -n "${GITHUB_REF_TYPE:-}" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_name="$tag"
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumine-harmonyos-${{ steps.meta.outputs.artifact_suffix }}
          path: ${{ env.HAP_GLOB }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          haps=(entry/build/default/outputs/default/*.hap)
          if [[ ${#haps[@]} -eq 0 ]]; then
            echo "HAP not found"
            exit 1
          fi
          for hap in "${haps[@]}"; do
            base_name="$(basename "$hap")"
            cp "$hap" "release-assets/lumine-${{ steps.meta.outputs.artifact_suffix }}-${base_name}"
          done
          cd release-assets
          for f in *; do sha256sum "$f" > "$f.sha256"; done

          tag="${{ steps.meta.outputs.release_tag }}"
          title="${{ steps.meta.outputs.release_name }}"
          if [[ -z "$title" ]]; then
            title="$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$title" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
